name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
            ${{ github.workspace }}/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -y --target_type=client --vs_runtime=MD

      - run: xmake -y -w

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/* -DestinationPath LL-ModMenu-client-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ModMenu
          path: bin/ModMenu

      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: LL-ModMenu-client-windows-x64.zip
          generate_release_notes: true
