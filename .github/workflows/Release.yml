name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/.xmake
            ${{ github.workspace }}/.xmake
          key: xmake-${{ hashFiles('xmake.lua') }}

      - run: xmake repo -u

      - run: xmake f -a x64 -m release -y --target_type=client --vs_runtime=MD

      - run: xmake -y -w

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/ModMenu/* -DestinationPath ModMenu-${{ github.ref_name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ModMenu
          path: bin/ModMenu

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ModMenu-${{ github.ref_name }}.zip
          generate_release_notes: true
